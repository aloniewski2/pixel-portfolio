function pixelText(text, scale, fill, outline, shadow){
  text = String(text).toUpperCase();
  const cols = text.length * 6 - 1, rows = 7, pad = 4;
  const c = document.createElement("canvas");
  c.width = (cols + pad) * scale; c.height = (rows + pad) * scale;
  const g = c.getContext("2d");
  const stamp = (dx, dy, color) => {
    g.fillStyle = color;
    for (let i = 0; i < text.length; i++){
      const gl = F[text[i]] || F[" "];
      for (let r = 0; r < rows; r++)
        for (let k = 0; k < 5; k++)
          if (gl[r][k] === "#") g.fillRect((i*6 + k + dx) * scale, (r + dy) * scale, scale, scale);
    }
  };
  if (shadow) stamp(3, 3, shadow);
  if (outline) for (const [dx,dy] of [[0,1],[2,1],[1,0],[1,2],[0,0],[2,0],[0,2],[2,2]]) stamp(dx, dy, outline);
  stamp(1, 1, fill);
  return c;
}

    el._scale = scale;
    el.replaceChildren(pixelText(text, scale, "#191a2c", "#fffaef", "#ff6f4a"));
    el.setAttribute("aria-label", text);
  });
}

/* ---------- a calmer version of the main page's sky ---------- */
const view = document.getElementById("sky"), vctx = view.getContext("2d");
const buf = document.createElement("canvas"), ctx = buf.getContext("2d");
const PAL = {
  sky: [[31,143,216],[111,200,242],[201,237,255]],
  cL: "#ffffff", cM: "#e8f5ff", cD: "#bcdcee",
  hF: "#6fbe5e", hN: "#43913f", sun: "#fff5b8", glow: "#ffffff"
};
let W = 0, H = 0, PIX = 5, clouds = [], hills = [], trees = [], art = [];
const rnd = (a,b) => a + Math.random() * (b - a);
const rgbOf = c => `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const mix = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const skyAt = t => t < 0.5 ? mix(PAL.sky[0], PAL.sky[1], t*2) : mix(PAL.sky[1], PAL.sky[2], (t-0.5)*2);

function disc(g, cx, cy, r, color){
  g.fillStyle = color;
  for (let y = -r; y <= r; y++){
    const w = Math.floor(Math.sqrt(Math.max(0, r*r - y*y)));
    if (w >= 0) g.fillRect(cx - w, cy + y, w*2 + 1, 1);
  }
}

function cloudSprite(scale){
  const parts = []; let w = 0;
  for (let i = 0, n = 3 + (Math.random()*3|0); i < n; i++){
    const r = Math.round(rnd(3,6) * scale);
    const x = Math.round(w + r * 0.75);
    parts.push({ x, y: Math.round(rnd(-1,1) * scale), r });
    w = x + r * 0.9;
  }
  const maxR = Math.max(...parts.map(p => p.r));
  const h = maxR*2 + 4, wd = Math.ceil(w + maxR + 2), cy = maxR + 2;
  const c = document.createElement("canvas");
  c.width = wd; c.height = h;
  const g = c.getContext("2d");
  for (const p of parts) disc(g, p.x, cy + p.y, p.r, PAL.cL);
  const px = g.getImageData(0,0,wd,h);
  for (let x = 0; x < wd; x++){
    let top = -1, bot = -1;
    for (let y = 0; y < h; y++) if (px.data[(y*wd+x)*4+3] > 0){ if (top < 0) top = y; bot = y; }
    if (top < 0) continue;
    g.fillStyle = PAL.cL; g.fillRect(x, top, 1, bot-top+1);
    g.fillStyle = PAL.cM; g.fillRect(x, bot - Math.max(2, ((bot-top)*0.32)|0), 1, Math.max(2, ((bot-top)*0.32)|0));
    g.fillStyle = PAL.cD; g.fillRect(x, bot, 1, 1);
  }
  return c;
}

function ridge(baseY, amp, seed){
  const pts = [];
  for (let x = 0; x <= W + 3; x += 3){
    const n = Math.sin((x+seed)*0.021)*0.6 + Math.sin((x+seed)*0.007)*0.4;
    pts.push({ x, y: Math.round(baseY - n*amp) });
  }
  return pts;
}

function resize(){
  const dw = Math.max(1, innerWidth), dh = Math.max(1, innerHeight);
  PIX = dw < 640 ? 4 : 5;
  W = Math.max(2, Math.ceil(dw/PIX)); H = Math.max(2, Math.ceil(dh/PIX));
  buf.width = W; buf.height = H;
  view.width = dw; view.height = dh;
  view.style.width = dw + "px"; view.style.height = dh + "px";
  ctx.imageSmoothingEnabled = false; vctx.imageSmoothingEnabled = false;

  art = [cloudSprite(0.8), cloudSprite(1.1), cloudSprite(1.5), cloudSprite(1.2), cloudSprite(0.9)];
  clouds = art.map((a, i) => ({ art: i, x: rnd(-40, W), y: Math.round(rnd(0.06, 0.55) * H), sp: 0.05 + i*0.03 }));
  hills = [ridge(H*0.93, H*0.045, 120), ridge(H*0.985, H*0.035, 900)];
  trees = [];
  for (let i = 0; i < Math.max(4, W/40|0); i++){
    const x = Math.round(rnd(0, W));
    const seg = hills[1][Math.min(hills[1].length-1, Math.round(x/3))];
    trees.push({ x, y: seg ? seg.y : H, h: Math.round(rnd(5,9)) });
  }
  paintSky();
  renderHeadings();
}

let skyCache = document.createElement("canvas");
function paintSky(){
  skyCache.width = W; skyCache.height = H;
  const g = skyCache.getContext("2d"), N = 16;
  const band = i => skyAt(Math.min(1, (i + 0.5)/N));
  for (let i = 0; i < N; i++){
    const y0 = Math.floor(i*H/N), y1 = Math.floor((i+1)*H/N);
    g.fillStyle = rgbOf(band(i)); g.fillRect(0, y0, W, y1-y0);
  }
  for (let i = 1; i < N; i++){
    const y = Math.floor(i*H/N);
    g.fillStyle = rgbOf(band(i));
    for (let x = 0; x < W; x += 2) g.fillRect(x, y-1, 1, 1);
    g.fillStyle = rgbOf(band(i-1));
    for (let x = 1; x < W; x += 2) g.fillRect(x, y, 1, 1);
  }
}

function frame(){
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(skyCache, 0, 0);

  const sx = Math.round(W * 0.82), sy = Math.round(H * 0.18), r = Math.round(Math.min(W,H)*0.05) + 4;
  ctx.globalAlpha = .35; disc(ctx, sx, sy, r+5, PAL.glow);
  ctx.globalAlpha = 1;   disc(ctx, sx, sy, r, PAL.sun);

  for (const c of clouds){
    if (!REDUCED) c.x += c.sp;
    const a = art[c.art];
    if (c.x > W + a.width) c.x = -a.width - rnd(0, 60);
    ctx.drawImage(a, Math.round(c.x), c.y);
  }

  ctx.fillStyle = PAL.hF;
  for (const p of hills[0]) ctx.fillRect(p.x, p.y, 3, H - p.y);
  ctx.fillStyle = "#2c5c2a";
  for (const t of trees){
    const ty = t.y - t.h;
    ctx.fillRect(t.x, ty + t.h - 1, 1, 2);
    for (let i = 0; i < t.h; i++){
      const w = 1 + Math.round((i/t.h) * 3);
      ctx.fillRect(t.x - (w>>1), ty + i, w, 1);
    }
  }
  ctx.fillStyle = PAL.hN;
  for (const p of hills[1]) ctx.fillRect(p.x, p.y, 3, H - p.y);

  vctx.drawImage(buf, 0, 0, W, H, 0, 0, view.width, view.height);
  requestAnimationFrame(frame);
}

/* ---------- the list ---------- */
const grid = document.getElementById("grid");
const filters = document.getElementById("filters");
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const niceDate = iso => new Date(iso + "T00:00:00").toLocaleDateString("en-US", { month: "short", year: "numeric" });

function card(p){
  const c = el("article", "panel card rv");
  c.dataset.langs = p.langs.join("|");

  const top = el("div", "top");
  top.append(el("h2", null, p.name));
  if (p.stars > 0) top.append(el("span", "star", "★ " + p.stars));
  c.append(top);

  const tags = el("div", "tags");
  if (FEATURED[p.name]) tags.append(el("span", "tag feat", "Featured"));
  p.langs.forEach(l => tags.append(el("span", "tag lang", l)));
  if (p.empty) tags.append(el("span", "tag wip", "Empty repo"));
  if (tags.childElementCount) c.append(tags);

  c.append(p.blurb
    ? el("p", "blurb", p.blurb)
    : el("p", "blurb none", "No description on GitHub yet."));

  const foot = el("div", "foot");
  foot.append(el("span", "when", "Updated " + niceDate(p.updated)));
  const repo = el("a", "link", "Code");
  repo.href = p.url; repo.target = "_blank"; repo.rel = "noopener";
  repo.setAttribute("aria-label", `${p.name} source code on GitHub`);
  foot.append(repo);
  if (p.home){
    const live = el("a", "link ghost", "Live");
    live.href = p.home; live.target = "_blank"; live.rel = "noopener";
    live.setAttribute("aria-label", `${p.name} live site`);
    foot.append(live);
  }
  c.append(foot);
  return c;
}

function build(){
  const langs = new Map();
  PROJECTS.forEach(p => p.langs.forEach(l => langs.set(l, (langs.get(l) || 0) + 1)));
  const top = [...langs.entries()].sort((a,b) => b[1]-a[1]).filter(([,n]) => n > 1).map(([l]) => l);

  const mk = (label, value, on) => {
    const b = el("button", null, label);
    b.type = "button";
    b.dataset.lang = value;
    b.setAttribute("aria-pressed", String(on));
    return b;
  };
  filters.append(mk(`All (${PROJECTS.length})`, "", true), ...top.map(l => mk(l, l, false)));
  const count = el("span", "count", "");
  filters.append(count);

  PROJECTS.forEach(p => grid.append(card(p)));

  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
  }), { threshold: .1 });
  grid.querySelectorAll(".rv").forEach(n => io.observe(n));

  function apply(lang){
    let shown = 0;
    [...grid.children].forEach((c, i) => {
      const hit = !lang || c.dataset.langs.split("|").includes(lang);
      c.hidden = !hit;
      if (hit){ shown++; c.classList.add("in"); }
    });
    count.textContent = `${shown} shown`;
    [...filters.querySelectorAll("button")].forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  }

  filters.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (b) apply(b.dataset.lang);
  });
  count.textContent = `${PROJECTS.length} shown`;
}

/* When this page is viewed as a published artifact, index.html isn't there —
   send those links to the artifact instead. */
const HOME_ARTIFACT = "https://claude.ai/code/artifact/fddda306-8995-4b1a-a06e-a714a6746836";
if (location.hostname.endsWith("claude.ai")){
  document.querySelectorAll('a[href="index.html"]').forEach(a => { a.href = HOME_ARTIFACT; });
}

let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 120); });
build();
resize();
requestAnimationFrame(frame);
})();
</script>
